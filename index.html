<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Draft Program</title>
<meta name="description" content="애플 스타일의 미니멀한 라이브 드래프트 에디터. 실시간 프리뷰, 시연 모드, 마크다운 다운로드와 공유를 지원합니다." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <!-- ===== Top Header ===== -->
  <header class="topbar glass">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <input id="projectTitle" class="title-input" value="Live Draft Program" spellcheck="false" aria-label="프로젝트 타이틀" />
    </div>

    <div class="actions">
      <button id="themeToggle" class="icon-btn" title="다크/라이트 모드 전환" aria-label="테마 전환">
        <span class="theme-icon sun">☀️</span>
        <span class="theme-icon moon">🌙</span>
      </button>
      <button id="presentBtn" class="btn btn-ghost">
        <span class="btn-ico">▶</span><span class="btn-label">시연 모드</span>
      </button>
      <button id="shareBtn" class="btn btn-ghost">
        <span class="btn-ico">🔗</span><span class="btn-label">공유하기</span>
      </button>
      <button id="downloadBtn" class="btn btn-primary">
        <span class="btn-ico">⬇</span><span class="btn-label">다운로드 (.md)</span>
      </button>
    </div>
  </header>

  <!-- ===== Main Split Workspace ===== -->
  <main class="workspace">

    <!-- Left: Editor -->
    <section class="panel editor-panel">
      <div class="panel-header">
        <h2>섹션 구성</h2>
        <button id="addSectionBtn" class="btn btn-small btn-primary">+ 섹션 추가</button>
      </div>
      <div id="sectionList" class="section-list"></div>
      <p class="hint-text">카드를 드래그해서 순서를 바꿀 수 있어요 · Markdown 문법 지원 (**굵게**, - 목록, [링크](url))</p>
    </section>

    <!-- Right: Live Preview -->
    <section class="panel preview-panel">
      <div class="panel-header">
        <h2>라이브 프리뷰</h2>
        <span class="live-dot" title="실시간 동기화 중"><span class="dot"></span> LIVE</span>
      </div>
      <div id="previewArea" class="preview-area"></div>
    </section>

  </main>
</div>

<!-- ===== Presentation / Focus Mode Overlay ===== -->
<div id="presentOverlay" class="present-overlay" hidden>
  <button id="exitPresent" class="present-exit" aria-label="시연 모드 종료">✕</button>
  <div class="present-stage">
    <div id="presentContent" class="present-content"></div>
  </div>
  <div class="present-nav">
    <button id="presentPrev" class="present-nav-btn" aria-label="이전 섹션">‹</button>
    <div id="presentDots" class="present-dots"></div>
    <button id="presentNext" class="present-nav-btn" aria-label="다음 섹션">›</button>
  </div>
</div>

<!-- ===== Toast Container ===== -->
<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
